<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aayush — Dynamic Creative Portfolio</title>
  
  <!-- Google Fonts + Phosphor Icons (External Libraries) -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/css/home.css">
</head>
<body>

  <!---- ============================================
     BACKGROUND LAYERS (Theme Images)
     These divs show different backgrounds based on theme
  ============================================-->
  <div class="bg-layer" id="bg-space"><video src="/videos/your_video.mp4" autoplay muted loop playsinline></video>alt="space"/></div>
  <div class="bg-layer" id="bg-rain"><img src="https://images.unsplash.com/photo-1438449805896-28a666819a20?w=1600&q=80" alt="rain"/></div>
   <div class="bg-layer" id="bg-snow"><video src="/videos/snow.mp4" autoplay muted loop playsinline></video></div>
  <div class="bg-layer" id="bg-sun"><video src="/videos/sunny w.mp4" autoplay muted loop playsinline></video></div></div>
  <div class="bg-layer" id="bg-forest"><img src="https://images.unsplash.com/photo-1441974231531-c622288db8b4?w=1600&q=80" alt="forest"/></div>
  <div class="bg-layer" id="bg-aurora"><img src="/images/aurora.jpg" alt="aurora"/></div>
  
  <!-- Canvas for Rain and Snow Particle Effects -->
  <canvas id="rain-canvas"></canvas>
  <canvas id="snow-canvas"></canvas>

  <!-- Main Content Wrapper -->
  <div class="page-wrapper">
    
    <!-----============================================
       NAVIGATION BAR
       Contains: Logo, Nav Links, Theme Switcher
       Mobile responsive - all items in single line
    ============================================ --->
    <nav class="glass-navbar">
      <!-- LEFT: Logo and Brand Name -->
      <div class="nav-left">
        <a href="#" class="nav-logo">
          <div class="logo-icon">
            <svg viewBox="0 0 32 32">
              <path d="M16 2L2 28H9.5L16 15.5L22.5 28H30L16 2Z" fill="currentColor"/>
              <path d="M16 15.5L9.5 28H2L16 2V15.5Z" fill="rgba(0,0,0,0.2)"/>
            </svg>
          </div>
          <span class="brand-text">AAYUSH</span>
        </a>
      </div>

      <!-- CENTER: Navigation Links (Home, Work, Blog, Resume) -->
      <div class="nav-center">
        <a href="#" class="nav-link active"><i class="ph ph-house"></i><span>Home</span></a>
        <a href="work.html" class="nav-link"><i class="ph ph-briefcase"></i><span>Work</span></a>
        <a href="#" class="nav-link"><i class="ph ph-pen-nib"></i><span>Blog</span></a>
        <a href="#" class="nav-link"><i class="ph ph-file-text"></i><span>Resume</span></a>
      </div>
      
      <!-- Divider Line -->
      <div class="divider"></div>
      
      <!-- RIGHT: Theme Switcher Dropdown -->
      <div class="nav-right">
        <div class="theme-switcher" id="themeSwitcher">
          <div class="current-theme" id="themeBtn">
            <span id="themeIcon"><i class="ph ph-planet"></i></span>
            <span id="themeLabel">Theme</span>
            <i class="ph ph-caret-down chevron"></i>
          </div>
          <!-- Dropdown Menu with 6 Theme Options -->
          <div class="theme-dropdown" id="themeDropdown">
            <div class="theme-option" data-theme="space"><i class="ph ph-planet"></i> Night Mode</div>
            <div class="theme-option" data-theme="rain"><i class="ph ph-cloud-rain"></i> Rain Mode</div>
            <div class="theme-option" data-theme="snow"><i class="ph ph-snowflake"></i> Snow Mode</div>
            <div class="theme-option" data-theme="sun"><i class="ph ph-sun"></i> Sunny Mode</div>
            <div class="theme-option" data-theme="forest"><i class="ph ph-tree-evergreen"></i> Forest Mode</div>
            <div class="theme-option" data-theme="aurora"><i class="ph ph-sparkle"></i> Aurora Mode</div>
          </div>
        </div>
      </div>
    </nav>

    <!---- ============================================
       HERO SECTION (Main Content Area)
       Contains: Profile Image, Name, Title, Music Card, Social Links
    ============================================ --->
    <div class="hero-container">
      
      <!-- LEFT SIDE: Profile Avatar (Circle Image) -->
      <div class="hero-left">
        <div class="avatar-wrapper">
          <img src="/images/analycar1.jpg
          " alt="Aayush Profile" class="avatar-img">
        </div>
      </div>

      <!-- CENTER SIDE: Personal Information -->
      <div class="hero-center">
        <h1 class="hero-name">Aayush Panche</h1>
        <h2 class="hero-subtitle">Engineer</h2>
        <p class="hero-desc">I build creative, functional and user-focused web experiences.</p>
        
        <!-- MUSIC CARD: Shows currently playing / last played song -->
        <div class="music-card">
          <div class="music-icon"><i class="ph ph-spotify-logo"></i></div>
          <div class="music-info">
            <span class="music-label">Spotify Last Play</span>
            <div class="waveform">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
          <button class="play-btn"><i class="ph ph-play-fill"></i></button>
        </div>

        <!-- SOCIAL LINKS: All social media platforms -->
        <div class="social-row">
          <a href="#" class="social-btn"><i class="ph ph-x-logo"></i></a>
          <a href="#" class="social-btn"><i class="ph ph-linkedin-logo"></i></a>
          <a href="#" class="social-btn"><i class="ph ph-github-logo"></i></a>
          <a href="#" class="social-btn"><i class="ph ph-youtube-logo"></i></a>
          <a href="#" class="social-btn"><i class="ph ph-instagram-logo"></i></a>
          <a href="#" class="social-btn"><i class="ph ph-envelope-simple"></i></a>
        </div>
      </div>

      <!-- RIGHT SIDE: 3D Character / Avatar with floating animation -->
      <div class="hero-right">
        <div class="character-wrapper">
          <img src="/images/luffy5.png" alt="3D Avatar" class="character-img" style="border-radius: 20px;">
          <div class="floating-text">
            <span>haa!</span>
            <i class="ph ph-arrow-bend-right-down"></i>
          </div>
          <!-- Floating Particles for decoration -->
          <div class="particle p1"></div>
          <div class="particle p2"></div>
          <div class="particle p3"></div>
        </div>
      </div>
    </div>
    
    <!-- Footer Note -->
    <div class="footer-note">⚡Aayush Panche — Frontend Developer & Animator
    </div> <!-- SOCIAL LINKS: All social media platforms -->
        <div class="social-row">
          <a href="#" class="social-btn"><i class="ph ph-x-logo"></i></a>
          <a href="#" class="social-btn"><i class="ph ph-linkedin-logo"></i></a>
          <a href="#" class="social-btn"><i class="ph ph-github-logo"></i></a>
          <a href="#" class="social-btn"><i class="ph ph-youtube-logo"></i></a>
          <a href="#" class="social-btn"><i class="ph ph-instagram-logo"></i></a>
          <a href="#" class="social-btn"><i class="ph ph-envelope-simple"></i></a>
        </div>
      </div>

    </div>
  </div>

  <!-- Main JavaScript File -->
  <script src="/java scrips/home.js"></script>
</body>
</html>
